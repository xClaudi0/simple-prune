<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-labelledby="t d">
<title id="t">simple prune</title>
<desc id="d">Animated terminal: running "docker sp -a" lists the images that "docker image prune -a" would remove, and removes nothing.</desc>
<style>
text{font-family:Menlo,"DejaVu Sans Mono","Courier New",monospace;font-size:15px}
@keyframes cur{0%,4.444%{transform:scaleX(1);animation-timing-function:steps(12,end)}15.556%,100%{transform:scaleX(0)}}
@keyframes mv{0%,4.444%{transform:translateX(0);animation-timing-function:steps(12,end)}15.556%,100%{transform:translateX(108.0px)}}
@keyframes vis1{0%,18.322999999999997%{opacity:1}18.333%,100%{opacity:0}}
@keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes h{0%,19.99%{opacity:0}20.0%,100%{opacity:1}}
@keyframes r0{0%,21.933999999999997%{opacity:0}21.944%,100%{opacity:1}}
@keyframes r1{0%,23.878999999999998%{opacity:0}23.889%,100%{opacity:1}}
@keyframes r2{0%,25.822999999999997%{opacity:0}25.833%,100%{opacity:1}}
@keyframes r3{0%,27.767999999999997%{opacity:0}27.778%,100%{opacity:1}}
@keyframes r4{0%,29.712%{opacity:0}29.722%,100%{opacity:1}}
@keyframes f1{0%,34.434000000000005%{opacity:0}34.444%,100%{opacity:1}}
@keyframes f2{0%,36.101%{opacity:0}36.111%,100%{opacity:1}}
@keyframes f3{0%,37.212%{opacity:0}37.222%,100%{opacity:1}}
@keyframes ro{0%,41.657000000000004%{opacity:0}41.667%,100%{opacity:1}}
@keyframes ip{0%,45.546%{opacity:0}45.556%,100%{opacity:1}}
@keyframes life{0%,91.111%{opacity:1}95.556%,99.9%{opacity:0}100%{opacity:1}}
</style>
<rect width="900" height="455" rx="12" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="899" height="454" rx="12" fill="none" stroke="#30363d"/>
<path d="M0.5 12.5a12 12 0 0 1 12-12h875a12 12 0 0 1 12 12V40H0.5z" fill="#161b22"/>
<line x1="0" y1="40.5" x2="900" y2="40.5" stroke="#30363d"/>
<circle cx="24" cy="21" r="6" fill="#ff5f56"/><circle cx="44" cy="21" r="6" fill="#ffbd2e"/><circle cx="64" cy="21" r="6" fill="#27c93f"/>
<text x="450.0" y="26" fill="#6e7681" text-anchor="middle" style="font-size:13px">simple prune — preview what “docker image prune” would delete</text>
<g style="animation:life 18.0s linear infinite">
<text x="32" y="92" fill="#7ee787" font-weight="700">$</text>
<text x="50.0" y="92" fill="#e6edf3" xml:space="preserve">docker sp -a</text>
<rect x="50.0" y="76" width="112.0" height="22" fill="#0d1117" style="transform-origin:162.0px 0;animation:cur 18.0s linear infinite"/>
<g style="animation:mv 18.0s linear infinite"><g style="animation:vis1 18.0s linear infinite"><rect x="50.0" y="78" width="9.0" height="19" fill="#e6edf3" style="animation:blink 1s step-end infinite"/></g></g>
<text x="32" y="125" fill="#8b949e" font-weight="700" xml:space="preserve" style="animation:h 18.0s linear infinite;opacity:0">IMAGE ID      TAGS                  CREATED               SIZE</text>
<text x="32" y="150" xml:space="preserve" style="animation:r0 18.0s linear infinite;opacity:0"><tspan fill="#e3b341">7c3e91ab20d4  </tspan><tspan fill="#79c0ff">mongo:7               </tspan><tspan fill="#8b949e">2026-05-13 18:11:47   </tspan><tspan fill="#e6edf3" font-weight="700">1.3GB</tspan></text>
<text x="32" y="175" xml:space="preserve" style="animation:r1 18.0s linear infinite;opacity:0"><tspan fill="#e3b341">b84f0a62c1e9  </tspan><tspan fill="#79c0ff">postgres:16           </tspan><tspan fill="#8b949e">2026-04-07 01:39:11   </tspan><tspan fill="#e6edf3" font-weight="700">649MB</tspan></text>
<text x="32" y="200" xml:space="preserve" style="animation:r2 18.0s linear infinite;opacity:0"><tspan fill="#e3b341">5a6c1e8f4b77  </tspan><tspan fill="#6e7681">&lt;none&gt;:&lt;none&gt;         </tspan><tspan fill="#8b949e">2025-07-09 17:21:03   </tspan><tspan fill="#e6edf3" font-weight="700">433MB</tspan></text>
<text x="32" y="225" xml:space="preserve" style="animation:r3 18.0s linear infinite;opacity:0"><tspan fill="#e3b341">e02d7f5a9c13  </tspan><tspan fill="#79c0ff">node:22-alpine        </tspan><tspan fill="#8b949e">2026-03-02 09:12:30   </tspan><tspan fill="#e6edf3" font-weight="700">178MB</tspan></text>
<text x="32" y="250" xml:space="preserve" style="animation:r4 18.0s linear infinite;opacity:0"><tspan fill="#e3b341">21a5bc93624c  </tspan><tspan fill="#79c0ff">busybox:1.36          </tspan><tspan fill="#8b949e">2023-05-18 22:34:17   </tspan><tspan fill="#e6edf3" font-weight="700">8.91MB</tspan></text>
<text x="32" y="289" xml:space="preserve" style="animation:f1 18.0s linear infinite;opacity:0"><tspan fill="#ffa657" font-weight="700">5 images</tspan><tspan fill="#e6edf3"> would be removed by </tspan><tspan fill="#79c0ff">'docker image prune -a'</tspan><tspan fill="#e6edf3"> — total </tspan><tspan fill="#e6edf3" font-weight="700">2.57GB</tspan></text>
<text x="32" y="311" fill="#6e7681" xml:space="preserve" style="animation:f2 18.0s linear infinite;opacity:0">(total is an overestimate: layers shared between images are counted more than once;</text>
<text x="32" y="331" xml:space="preserve" style="animation:f3 18.0s linear infinite;opacity:0"><tspan fill="#6e7681"> at least </tspan><tspan fill="#7ee787" font-weight="700">1.9GB</tspan><tspan fill="#6e7681"> is used only by these images and will certainly be freed)</tspan></text>
<text x="32" y="370" xml:space="preserve" style="animation:ro 18.0s linear infinite;opacity:0"><tspan fill="#7ee787" font-weight="700">✔ read-only</tspan><tspan fill="#8b949e"> — nothing was removed</tspan></text>
<g style="animation:ip 18.0s linear infinite;opacity:0"><text x="32" y="403" fill="#7ee787" font-weight="700">$</text><rect x="50.0" y="389" width="9.0" height="19" fill="#e6edf3" style="animation:blink 1s step-end infinite"/></g>
</g>
</svg>
